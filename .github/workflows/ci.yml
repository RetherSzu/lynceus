name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Vérifier le formatage
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Analyse statique
        run: go vet ./...

      - name: Tests
        run: go test ./... -race -cover

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: linux,   goarch: amd64, ext: "" }
          - { goos: linux,   goarch: arm64, ext: "" }   # utile pour analyseurs sur Raspberry Pi / NAS
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Cross-compile ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}+${GITHUB_SHA::7}" \
            -o dist/lynceus-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/dfirflow

      - uses: actions/upload-artifact@v4
        with:
          name: lynceus-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

title: Shadow copies deleted with vssadmin
id: 640e0339-c6ec-44c6-ac37-cf83d4d59f37
status: test
description: vssadmin was used to delete volume shadow copies, which prevents recovery and often precedes ransomware encryption.
author: DFIRFlow
license: Apache-2.0
tags:
    - attack.impact
    - attack.t1490
logsource:
    product: windows
    category: process_creation
detection:
    selection_image:
        Image|endswith: '\vssadmin.exe'
    selection_cli:
        CommandLine|contains|all:
            - 'delete'
            - 'shadows'
    condition: all of selection_*
falsepositives:
    - Backup software that removes its own snapshots
level: high

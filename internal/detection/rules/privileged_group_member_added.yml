title: Member added to a privileged group
id: c45e29cd-cdb3-495e-9bb4-596a96da98bb
status: test
description: A member was added to Administrators, Domain Admins, Schema Admins or Enterprise Admins, identified by SID so that the rule does not depend on the system language.
author: DFIRFlow
license: Apache-2.0
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098
logsource:
    product: windows
    service: security
detection:
    selection_event:
        EventID:
            - 4728
            - 4732
            - 4756
    selection_builtin:
        TargetSid: S-1-5-32-544
    selection_domain:
        TargetSid|endswith:
            - '-512'
            - '-518'
            - '-519'
    condition: selection_event and (selection_builtin or selection_domain)
falsepositives:
    - Administrative changes
level: high
